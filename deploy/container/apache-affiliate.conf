ServerTokens Prod
ServerSignature Off
DirectoryIndex index.php

RedirectMatch 302 ^/$ /public/

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/public>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html/admin>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
