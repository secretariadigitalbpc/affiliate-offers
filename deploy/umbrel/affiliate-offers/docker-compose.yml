version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: affiliate-offers_app_1
      APP_PORT: 80

  app:
    image: ghcr.io/secretariadigitalbpc/affiliate-offers:0.1.1@sha256:ff64e6f104e7631382a5271261ab8da3bff827bc3e79d591ceffb21172672be3
    restart: on-failure
    env_file:
      - ${APP_DATA_DIR}/app.env
    volumes:
      - ${APP_DATA_DIR}/app.env:/var/www/html/.env:ro
      - ${APP_DATA_DIR}/data/storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/public/api/health.php') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
    restart: on-failure
    environment:
      MARIADB_DATABASE: affiliate_system
      MARIADB_USER: affiliate
      MARIADB_PASSWORD: ${APP_AFFILIATE_OFFERS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_AFFILIATE_OFFERS_DB_ROOT_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
